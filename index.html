<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#176f73" />
  <meta name="description" content="La MultipliCueva: una aventura amigable para aprender las tablas de multiplicar del 1 al 10." />
  <title>La MultipliCueva</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar" aria-label="Estado del jugador">
      <button class="brand" data-action="home" aria-label="Ir al mapa de La MultipliCueva">
        <span class="brand-mark" aria-hidden="true">×</span>
        <span>La MultipliCueva</span>
      </button>
      <div class="stat-pills">
        <div class="stat-pill" title="Racha diaria"><span aria-hidden="true">🔥</span><strong id="daily-streak">1</strong></div>
        <div class="stat-pill" title="Estrellas"><span aria-hidden="true">⭐</span><strong id="stars">0</strong></div>
        <div class="stat-pill" title="Puntos de experiencia"><span aria-hidden="true">⚡</span><strong id="xp">0</strong></div>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-action="home" class="nav-item active"><span aria-hidden="true">🗺️</span><span>Cueva</span></button>
      <button data-action="review" class="nav-item"><span aria-hidden="true">🧠</span><span>Repaso</span><i id="review-dot" class="notification-dot" hidden></i></button>
      <button data-action="plan" class="nav-item"><span aria-hidden="true">📅</span><span>Plan</span></button>
      <button data-action="rewards" class="nav-item"><span aria-hidden="true">🏆</span><span>Premios</span></button>
      <button data-action="settings" class="nav-item"><span aria-hidden="true">⚙️</span><span>Ajustes</span></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <div id="confetti" aria-hidden="true"></div>

  <template id="welcome-template">
    <div class="welcome-backdrop">
      <section class="welcome-card" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
        <div class="mascot giant" aria-hidden="true"><span>×</span></div>
        <p class="eyebrow">UNA CUEVA LLENA DE DESAFÍOS</p>
        <h1 id="welcome-title">¡Bienvenido a La MultipliCueva!</h1>
        <p>Explorá una tabla por vez, encontrá cristales y abrí nuevas cámaras.</p>
        <label for="player-name">¿Cómo se llama el explorador?</label>
        <input id="player-name" maxlength="16" autocomplete="off" placeholder="Escribí su nombre" />
        <button class="primary-btn full" data-action="start-game">Entrar a la cueva →</button>
        <small>El progreso se guarda únicamente en este dispositivo.</small>
      </section>
    </div>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
